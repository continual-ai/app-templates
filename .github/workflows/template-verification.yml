name: Template verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, and scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.3.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check templates
        run: pnpm check

      - name: Build templates
        run: pnpm build

      - name: Verify isolated scaffolds
        run: pnpm verify:templates
