packages:
  - "templates/*"

# Allow these dependencies to run their install scripts. pnpm 11 blocks all
# install scripts by default unless explicitly allowlisted. The previous
# config lived under `pnpm.onlyBuiltDependencies` in the root package.json,
# which pnpm 11 silently ignores (see ERR_PNPM_IGNORED_BUILDS warning).
allowBuilds:
  esbuild: true
  msw: true
  sharp: true

# Exempt our own first-party packages from pnpm's supply-chain minimumReleaseAge
# gate. The age check guards against compromised third-party uploads; @continual/*
# is published by us and is often pinned to a version released within the cutoff
# window, which otherwise breaks `pnpm install --frozen-lockfile` in image builds.
minimumReleaseAgeExclude:
  - '@continual/*'
